<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mostafa Ahmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-orb" style="top: -10%; right: -10%;"></div>
    
    <div class="login-card glass-card p-10 z-10">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-primary/20">
                <i data-lucide="shield-lock" class="text-primary w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">Admin Portal</h1>
            <p class="text-gray-500 text-sm">Secure authorization required</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-mono text-gray-500 uppercase tracking-widest mb-2">Access Key</label>
                <input type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-5 py-4 focus:border-primary/50 focus:outline-none transition-all text-white font-mono">
            </div>
            
            <button type="submit" class="primary-btn w-full justify-center py-4">
                Verify Identity
            </button>
            
            <a href="index.html" class="block text-center text-xs text-gray-500 hover:text-white transition">
                Return to Interface
            </a>
        </form>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Verification system offline. Access denied.');
        });
    </script>
</body>
</html>
